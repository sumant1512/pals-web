<nav
  [ngClass]="{ 'nav-box-shadow': scrollStatus }"
  class="navbar navbar-expand-lg navbar-light bg-light position-fixed w-100 py-0"
  #header
>
  <div
    [ngClass]="isHeaderOpen ? '' : 'header-container'"
    class="container-fluid bg-light px-0"
  >
    <img
      class="navbar-brand cursor-pointer"
      [routerLink]="['']"
      src="/logo/header_logo.png"
      alt="Pals Paint Logo"
    />
    <button
      class="navbar-toggler me-2"
      type="button"
      data-bs-toggle="collapse"
      data-bs-target="#navbarNav"
      aria-controls="navbarNav"
      aria-expanded="false"
      aria-label="Toggle navigation"
      (click)="navToggle()"
    >
      <span class="navbar-toggler-icon"></span>
    </button>
    <div
      class="collapse navbar-collapse text-center text-lg-end header-link-align bg-light"
      id="navbarNav"
    >
      <ul class="navbar-nav float-lg-end">
        <li
          class="nav-item me-0 me-md-3 me-lg-4"
          *ngFor="let link of headerLinks"
        >
          <a
            class="nav-link active d-block d-lg-none"
            aria-current="page"
            data-bs-toggle="collapse"
            data-bs-target="#navbarNav"
            (click)="navigateToPage(link.routePath)"
            [innerHTML]="link.label"
          ></a>
          <a
            class="nav-link active d-none d-lg-block"
            aria-current="page"
            (click)="navigateToPage(link.routePath)"
            [innerHTML]="link.label"
          ></a>
        </li>
        <li class="nav-item me-0 me-md-3 me-lg-4 d-block d-lg-none">
          <a
            class="nav-link contact-link"
            data-bs-toggle="collapse"
            data-bs-target="#navbarNav"
            [routerLink]="'contact'"
          >
            <button type="button" class="contact">CONTACT</button></a
          >
        </li>
        <li class="nav-item me-0 me-md-3 me-lg-4 d-none d-lg-block">
          <a class="nav-link contact-link" [routerLink]="'contact'">
            <button type="button" class="contact">CONTACT</button></a
          >
        </li>
        <li
          *ngIf="featureService.isEnabled('isOnlineOrderEnabled')"
          class="nav-item me-0 me-md-3 me-lg-4 d-none d-lg-block"
        >
          <a class="nav-link contact-link" (click)="authClick()">
            <button type="button" class="contact">
              {{ isUserLoggedIn ? "Logout" : "Login" }}
            </button></a
          >
        </li>
        <li
          *ngIf="featureService.isEnabled('isOnlineOrderEnabled')"
          class="nav-item me-0 me-md-3 me-lg-4 d-none d-lg-block"
        >
          <a class="nav-link contact-link" [routerLink]="'/cart'">
            <button type="button">Cart</button></a
          >
        </li>
      </ul>
    </div>
  </div>
</nav>
