<div class="container">
  <div class="content">
    <h1 class="title">We're Painting Something New!</h1>
    <p class="subtitle">
      Our new experience is on the way. Stay tuned for something beautiful.
    </p>

    <div class="timer">
      <div class="time-box">
        <span class="number">{{ days }}</span>
        <span class="label">Days</span>
      </div>
      <div class="time-box">
        <span class="number">{{ hours }}</span>
        <span class="label">Hours</span>
      </div>
      <div class="time-box">
        <span class="number">{{ minutes }}</span>
        <span class="label">Minutes</span>
      </div>
      <div class="time-box">
        <span class="number">{{ seconds }}</span>
        <span class="label">Seconds</span>
      </div>
    </div>

    <button class="notify-btn">Notify Me</button>
  </div>
</div>
