<div class="cursor-pointer">
  <img class="w-100" [src]="product.img" [alt]="product.productName" />
  <div>
    <h6 class="products-title mt-3" [title]="product.productName">
      {{ product.productName }} ({{ product.productType }})
    </h6>

    <p class="products-description mt-2 mb-0">
      Enhance your outdoors with paints and textures for every style.
    </p>
    <h6 class="products-price mt-2">$ {{ product.price }}</h6>
  </div>
</div>
