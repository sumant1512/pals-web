<div class="row mt-4">
  <div
    class="col-4 col-md-3 col-lg-2 text-center mb-5"
    *ngFor="let shade of colorShadesList; let index = index"
  >
    <div>
      <button
        class="shade-card mx-auto"
        [ngClass]="{ expanded: selectedShade === shade.shadeHexCode }"
        [style.backgroundColor]="shade.shadeHexCode"
        type="button"
        (click)="selectColor(shade.shadeHexCode)"
      ></button>

      <div class="mt-3">{{ shade.entityName }} {{ shade.entityCode }}</div>
    </div>
  </div>
</div>
