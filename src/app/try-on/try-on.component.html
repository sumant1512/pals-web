<div class="container try-on-container">
  <h5 class="modal-title" id="tryOnModalLabel">
    Try shades for your dream house
  </h5>

  <div class="row">
    <div class="col-12 col-md-10">
      <div>
        <svg
          width="100%"
          height="800"
          [style.background-image]="'url(' + backgroundImageUrl + ')'"
          (touchstart)="onTouchStart($event)"
          (touchmove)="onTouchMove($event)"
          (touchend)="onTouchEnd()"
          (mousedown)="onMouseDown($event)"
          (mousemove)="onMouseMove($event)"
          (mouseup)="onMouseUp()"
        >
          <ng-container *ngFor="let line of lines">
            <line
              [attr.x1]="line.x1"
              [attr.y1]="line.y1"
              [attr.x2]="line.x2"
              [attr.y2]="line.y2"
              stroke="blue"
            />
          </ng-container>

          <ng-container *ngFor="let shape of shapes">
            <polygon
              [attr.points]="shape.points"
              [attr.fill]="shape.fill"
              [attr.stroke]="shape.stroke"
              [attr.stroke-width]="shape.strokeWidth"
              (click)="fillColor(shape.id)"
            />
          </ng-container>

          <ng-container *ngIf="lineInProgress">
            <line
              [attr.x1]="lineInProgress.x1"
              [attr.y1]="lineInProgress.y1"
              [attr.x2]="lineInProgress.x2"
              [attr.y2]="lineInProgress.y2"
              stroke="blue"
            />
          </ng-container>
        </svg>
      </div>

      <div class="upload-btn-wrapper mt-3" (change)="handleImageUpload($event)">
        <button class="button">Upload a file</button>
        <input class="w-100 h-100" type="file" name="myfile" />
      </div>
    </div>
    <div class="col-12 col-md-2 mt-3 mt-md-0">
      <button
        type="button"
        class="btn btn-secondary mb-3 w-100"
        (click)="activateFillColor()"
      >
        Fill Color
      </button>
      <button
        type="button"
        class="btn btn-secondary mb-3 w-100"
        (click)="clearCanvas()"
      >
        Reset
      </button>
    </div>
  </div>

  <div class="mt-3">
    testing
    <app-shade-selector
      (onShadeSelect)="onShadeSelect($event)"
    ></app-shade-selector>
  </div>
</div>
