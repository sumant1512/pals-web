<div
  class="modal fade"
  id="tryOnModal"
  tabindex="-1"
  aria-labelledby="tryOnModalLabel"
  aria-hidden="true"
>
  <div class="modal-dialog modal-xl">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="tryOnModalLabel">
          Try shades for your dream house
        </h5>
        <button
          type="button"
          class="btn-close"
          data-bs-dismiss="modal"
          aria-label="Close"
        ></button>
      </div>
      <div class="modal-body text-center">
        <div class="row">
          <div class="col-12 col-md-10">
            <canvas
              (touchstart)="onTouchStart($event)"
              (touchmove)="onTouchMove($event)"
              (touchend)="onTouchEnd($event)"
              (mousedown)="onMouseDown($event)"
              (mousemove)="onMouseMove($event)"
              (mouseup)="onMouseUp($event)"
              (click)="fillSelectedShape($event)"
              #canvas
            ></canvas>
            <div
              class="upload-btn-wrapper"
              (change)="handleImageUpload($event)"
            >
              <button class="button">Upload a file</button>
              <input type="file" name="myfile" />
            </div>
          </div>
          <div class="col-12 col-md-2">
            <button
              type="button"
              class="btn btn-secondary mb-3 w-100"
              (click)="activateFillColor()"
            >
              Fill Color
            </button>
            <button
              type="button"
              class="btn btn-secondary mb-3 w-100"
              (click)="clearCanvas()"
            >
              Reset
            </button>
            <button
              type="button"
              class="btn btn-secondary mb-3 w-100"
              data-bs-dismiss="modal"
            >
              Cancel
            </button>
            <button type="button" class="btn btn-primary mb-3 w-100">
              Add
            </button>
          </div>
        </div>

        <div class="mt-3">
          <app-shade-selector
            (onShadeSelect)="onShadeSelect($event)"
          ></app-shade-selector>
        </div>
      </div>
      <div class="modal-footer">
        <button
          type="button"
          class="btn btn-secondary"
          (click)="activateFillColor()"
        >
          Fill Color
        </button>
        <button type="button" class="btn btn-secondary" (click)="clearCanvas()">
          Reset
        </button>
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
          Cancel
        </button>
        <button type="button" class="btn btn-primary">Add</button>
      </div>
    </div>
  </div>
</div>
