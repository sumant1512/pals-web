<div class="container product-container">
  <div class="container">
    <div class="row">
      <p>
        <a [routerLink]="'/'">Home</a> <span> > </span>
        <a [routerLink]="'/products'">Products</a><span> > </span>
        <a
          *ngIf="productDetails?.productId"
          [routerLink]="'/products/' + productDetails.productId"
          >{{ productDetails.productName }} ({{
            productDetails.productType
          }})</a
        >
      </p>
    </div>
    <div *ngIf="productDetails?.productId" class="row">
      <div class="col-sm-5">
        <div class="product-name-heading">
          {{ productDetails.productName }} ({{ productDetails.productType }})
        </div>
        <img
          src="./../../../assets/bucket-image.png"
          class="rounded float-start img-fluid"
          alt="..."
        />
      </div>
      <div class="col-sm-7">
        <div>
          Product Starting from
          <span class="fw-semibold">$450</span>
        </div>
        <div class="fw-semibold d-block mb-2">Select Colour</div>
        <div
          class="color-box d-inline-block rounded border border-dark me-2 ms-2"
        ></div>
        <div
          class="color-box d-inline-block rounded border border-dark me-2"
        ></div>
        <label class="fw-semibold d-block mb-2">Select Quantity</label>
        <div class="select-quantity-section mb-4">
          <!--Pack 1-->
          <div class="d-flex justify-content-between align-items-center mb-2">
            <span>! Ltr. Pack</span>
            <div class="d-flex align-items-center">
              <button class="btn btn-outline-secondary btn-sm">-</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<div *ngIf="productDetails?.productId">
  <app-shade-dialog
    [selectedPacket]="selectedPacket"
    (addShade)="add($event)"
  ></app-shade-dialog>
</div>
