<div class="container product-container">
  <div class="mb-4">
    <span><a [routerLink]="['']">Home</a> / </span>
    <span><a [routerLink]="'../'">Products</a> / </span>
    <span>{{ productDetails.name }}</span>
  </div>
  <div *ngIf="productDetails?.id" class="row">
    <div class="col-12 col-md-6">
      <img
        class="img-fluid"
        [src]="getImagePath(productDetails.imgName)"
        alt=""
      />
    </div>
    <div class="col-12 col-md-6">
      <h3>
        {{ productDetails.name }}
        <span *ngIf="productDetails.type"> ({{ productDetails.type }})</span>
      </h3>
      <div>
        <span>-{{ selectedPacket.discount }}%</span
        ><span> ₹{{ getDiscountedPrice(selectedPacket) }}</span>
      </div>
      <div>
        <span>M.R.P.:</span><del>₹{{ selectedPacket.mrp }}</del>
      </div>

      <button
        class="mt-3"
        type="button"
        *ngFor="let packet of productDetails.packetSize"
        (click)="selectPacket(packet)"
      >
        {{ packet.size }}
      </button>

      <div *ngIf="productDetails.isShadeEnabled" class="mt-3">
        <button
          type="button"
          class="btn btn-primary"
          data-bs-toggle="modal"
          data-bs-target="#exampleModal"
        >
          Select Shade
        </button>
      </div>

      <div class="center mt-4" *ngFor="let packet of selectedPacketList">
        <span class="me-3">Size: {{ packet.size }} </span>
        <span class="center me-3"
          >Color:
          <span
            class="selected-color-box ms-2"
            [style.backgroundColor]="packet.color"
          ></span>
        </span>
        <span>Price: ₹{{ getDiscountedPrice(packet) }}</span>
      </div>

      <div class="mt-3">
        <button
          type="button"
          class="btn btn-primary"
          [disabled]="!selectedPacketList.length"
          (click)="addToCart()"
        >
          Add to Cart
        </button>
      </div>
    </div>
  </div>
</div>

<app-shade-dialog
  [selectedPacket]="selectedPacket"
  (addShade)="add($event)"
></app-shade-dialog>
