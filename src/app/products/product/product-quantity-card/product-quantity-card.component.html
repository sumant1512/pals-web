<div class="container d-none d-lg-block">
  <div class="row paint-card">
    <div class="col-2">
      <img [src]="productImage" alt="Paint Bucket" class="img-fluid" />
    </div>
    <div class="col-4">
      <div class="fw-semibold product-pack">{{ packSize }} Pack</div>
      <div class="text-muted small product-name">{{ productName }}</div>
    </div>
    <div class="col-4 qty-section">
      <span
        *ngIf="featureService.isEnabled('isOnlineOrderEnabled')"
        class="me-2 qty-label"
        >Quantity:</span
      >
      <button
        *ngIf="featureService.isEnabled('isOnlineOrderEnabled')"
        class="btn qty-btn"
      >
        −
      </button>
      <span
        *ngIf="featureService.isEnabled('isOnlineOrderEnabled')"
        class="qty-count mx-2"
        >0</span
      >
      <button
        *ngIf="featureService.isEnabled('isOnlineOrderEnabled')"
        class="btn qty-btn"
      >
        +
      </button>
    </div>
    <div class="col-2">
      <div class="text-muted small price-label">Price</div>
      <div class="fw-bold price-amt">₹ {{ price }}</div>
    </div>
  </div>
</div>

<!-- mobile card -->

    <div class="col-8">

    <div class="col-4 text-end">
      <div class="text-muted small price-label">Price</div>

    <div class="col-12 mt-3 text-end">
      <span
        *ngIf="featureService.isEnabled('isOnlineOrderEnabled')"
        class="me-2 qty-label"
        >Quantity:</span
      >
      <button
        *ngIf="featureService.isEnabled('isOnlineOrderEnabled')"
        class="btn qty-btn"
      >
        −
      </button>
      <span
        *ngIf="featureService.isEnabled('isOnlineOrderEnabled')"
        class="qty-count mx-2"
        >0</span
      >
      <button
        *ngIf="featureService.isEnabled('isOnlineOrderEnabled')"
        class="btn qty-btn"
      >
        +
      </button>
    </div>
  </div>
</div>
