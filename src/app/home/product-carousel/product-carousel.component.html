<div class="container products-section">
  <app-heading-chips
    [label]="'HOME.PRODUCTS.HEADING' | translate"
  ></app-heading-chips>
  <div class="row mt-3 mb-2">
    <div class="col-6">
      <div>
        <h2>{{ "HOME.PRODUCTS.SUB_HEADING" | translate }}</h2>
      </div>
    </div>
    <div class="col-6 text-end">
      <app-nav-button
        [label]="'HOME.PRODUCTS.VIEW_BTN_LBL' | translate"
        (click)="navigateToProductsPage()"
      ></app-nav-button>
    </div>
  </div>
  <div class="row">
    <ng-container *ngIf="isProductsLoading">
      <div *ngFor="let _ of [1, 2, 3]" class="col-md-4 col-lg-4 mb-4">
        <app-skeleton
          [loading]="true"
          [height]="'410px'"
          [width]="'100%'"
          borderRadius="12px"
          class="mb-3"
        ></app-skeleton>
      </div>
    </ng-container>
    <ng-container *ngIf="!isProductsLoading">
      <div
        *ngFor="let product of productList?.slice(0, 3)"
        class="col-md-4 col-lg-4 mb-4"
      >
        <app-product-card
          [product]="product"
          (click)="navigateToProduct(product._id)"
        ></app-product-card>
      </div>
    </ng-container>
  </div>
</div>
