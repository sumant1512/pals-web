<div class="container category-section">
  <div class="row">
    <div *ngFor="let category of categories" class="col-6 col-md-4 col-lg-3">
      <div>
        <img
          class="img-fluid"
          [src]="category.image"
          [alt]="category.imageAlt"
        />
        <h2 class="category-title mt-2">{{ category.title }}</h2>
        <p class="category-desctiption">
          {{ category.description }}
        </p>
      </div>
    </div>
  </div>
</div>
