<nav
  [ngClass]="{ 'nav-box-shadow': scrollStatus }"
  class="navbar navbar-expand-lg navbar-light bg-light position-fixed w-100 py-0"
  #header
>
  <div
    [ngClass]="isHeaderOpen ? '' : 'header-container'"
    class="container-fluid bg-light ps-0"
  >
    <img class="navbar-brand" src="./../../../assets/header_logo.png" />
    <button
      class="navbar-toggler"
      type="button"
      data-bs-toggle="collapse"
      data-bs-target="#navbarNav"
      aria-controls="navbarNav"
      aria-expanded="false"
      aria-label="Toggle navigation"
      (click)="navToggle()"
    >
      <span class="navbar-toggler-icon"></span>
    </button>
    <div
      class="collapse navbar-collapse text-center text-lg-end header-link-align"
      id="navbarNav"
    >
      <ul class="navbar-nav float-lg-end">
        <li
          class="nav-item me-0 me-md-3 me-lg-4"
          *ngFor="let link of headerLinks"
        >
          <a
            class="nav-link active d-block d-lg-none"
            aria-current="page"
            data-bs-toggle="collapse"
            data-bs-target="#navbarNav"
            (click)="scrollPage(link.id)"
            [innerHTML]="link.label"
          ></a>
          <a
            class="nav-link active d-none d-lg-block"
            aria-current="page"
            (click)="scrollPage(link.id)"
            [innerHTML]="link.label"
          ></a>
        </li>
        <li class="nav-item me-0 me-md-3 me-lg-4 d-block d-lg-none">
          <a
            class="nav-link contact-link"
            data-bs-toggle="collapse"
            data-bs-target="#navbarNav"
            (click)="scrollPage('contact')"
          >
            <button type="button" class="contact">CONTACT</button></a
          >
        </li>
        <li class="nav-item me-0 me-md-3 me-lg-4 d-none d-lg-block">
          <a class="nav-link contact-link" (click)="scrollPage('contact')">
            <button type="button" class="contact">CONTACT</button></a
          >
        </li>
      </ul>
    </div>
  </div>
</nav>
