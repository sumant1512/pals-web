<div
  class="container d-flex align-items-center justify-content-center min-vh-100"
>
  <div class="card p-4 shadow" style="max-width: 400px; width: 100%">
    <h3 class="text-center mb-4">Login with Mobile</h3>

    <form [formGroup]="loginForm">
      <!-- Mobile Input -->
      <div *ngIf="!otpSent" class="mb-3">
        <label for="mobile" class="form-label">Mobile Number</label>
        <input
          type="tel"
          formControlName="mobile"
          class="form-control"
          placeholder="Enter mobile number"
        />
        <div
          class="text-danger mt-1"
          *ngIf="
            loginForm.controls['mobile'].invalid &&
            loginForm.controls['mobile'].touched
          "
        >
          Enter a valid mobile number
        </div>
      </div>

      <!-- OTP Input -->
      <div *ngIf="otpSent" class="mb-3">
        <label for="otp" class="form-label">Enter OTP</label>
        <input
          type="text"
          formControlName="otp"
          class="form-control"
          placeholder="Enter OTP"
          maxlength="6"
        />
      </div>

      <!-- Action Buttons -->
      <div class="d-grid gap-2 mt-4">
        <button
          type="button"
          class="btn btn-primary"
          *ngIf="!otpSent"
          (click)="sendOtp()"
          [disabled]="loginForm.controls['mobile'].invalid"
        >
          Send OTP
        </button>

        <div *ngIf="otpSent" class="d-flex justify-content-between">
          <button type="button" class="btn btn-secondary" (click)="goBack()">
            Back
          </button>
          <button type="button" class="btn btn-success" (click)="verifyOtp()">
            Login
          </button>
        </div>
      </div>
    </form>
  </div>
</div>
