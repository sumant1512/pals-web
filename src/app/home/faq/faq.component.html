<div class="container">
  <div class="row faq-container">
    <div class="col-12 col-md-4 mb-4 mb-md-0 text-center text-md-start">
      <app-heading-chips
        [label]="'SHARED.FAQ.HEADING' | translate"
      ></app-heading-chips>
      <div class="faq-header mt-3">
        {{ "SHARED.FAQ.SUB_HEADING" | translate }}
      </div>
      <div class="faq-description mb-3">
        {{ "SHARED.FAQ.CONTENT" | translate }}
      </div>
      <app-nav-button
        [label]="'SHARED.FAQ.TOUCH_BTN_LBL' | translate"
        (click)="navigateToContactsPage()"
      ></app-nav-button>
    </div>
    <div class="col-12 col-md-8">
      <div class="accordion accordion-flush" id="faqAacordion">
        <div
          class="question-card"
          *ngFor="let faq of faqQuestions; let i = index"
        >
          <h2 class="accordion-header">
            <button
              class="accordion-button pb-0"
              [class.collapsed]="!faq.isOpen"
              type="button"
              data-bs-toggle="collapse"
              [attr.data-bs-target]="'#' + faq.id"
              [attr.aria-expanded]="faq.isOpen"
              [attr.aria-controls]="faq.id"
            >
              <p class="question">{{ faq.question }}</p>
            </button>
          </h2>
          <div
            [id]="faq.id"
            class="accordion-collapse collapse answer"
            [class.show]="faq.isOpen"
            data-bs-parent="#faqAacordion"
          >
            <div class="accordion-body pt-0" [innerHTML]="faq.answer"></div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
