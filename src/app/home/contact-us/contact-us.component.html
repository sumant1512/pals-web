<div class="container">
  <div class="row contact-container text-center text-md-start">
    <div class="col-12 col-md-6 ps-3 ps-md-4 ps-lg-5 pe-3">
      <p class="title mt-4">Write to us</p>
      <form [formGroup]="contactForm">
        <div class="row">
          <div class="col-12 mb-3 col-md-6">
            <input
              class="w-100"
              type="text"
              name="firstName"
              formControlName="firstName"
              placeholder="First Name*"
            />
          </div>
          <div class="col-12 mb-3 col-md-6">
            <input
              class="w-100"
              type="text"
              name="lastName"
              formControlName="lastName"
              placeholder="Last Name"
            />
          </div>
          <div class="col-12 mb-3 col-md-6">
            <input
              class="w-100"
              type="text"
              name="phone"
              formControlName="phone"
              placeholder="Phone*"
            />
          </div>
          <div class="col-12 mb-3 col-md-6">
            <input
              class="w-100"
              type="text"
              name="email"
              formControlName="email"
              placeholder="Email"
            />
          </div>
          <div class="col-12 mb-3">
            <textarea
              class="w-100"
              name="message"
              formControlName="message"
              placeholder="Write your message..."
              rows="6"
            ></textarea>
          </div>
          <div class="col-12 mb-3">
            <button
              class="pals-btn"
              type="submit"
              [disabled]="contactForm.invalid"
              (click)="contact()"
            >
              Submit
            </button>
          </div>
        </div>
      </form>
    </div>
    <div class="d-none d-md-block col-md-6">
      <img
        class="img-fluid contact-image"
        src="./../../../assets/contact.png"
        alt=""
      />
    </div>
  </div>
</div>

<div
  [ngClass]="{ 'show d-block': isModalOpen }"
  class="modal fade modal-index"
  tabindex="-1"
  aria-hidden="true"
>
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title title">Pals Paint</h5>
        <button
          type="button"
          class="btn-close"
          (click)="closeModal()"
          aria-label="Close"
        ></button>
      </div>
      <div class="modal-body">{{ modalMessage }}</div>
      <div class="modal-footer">
        <button type="button" class="pals-btn" (click)="closeModal()">
          Close
        </button>
      </div>
    </div>
  </div>
</div>
