<div class="container">
  <div class="row">
    <div *ngFor="let qr of qrList" class="col-12 col-md-4">
      <qrcode
        [qrdata]="qr.code"
        [width]="256"
        [errorCorrectionLevel]="'M'"
      ></qrcode>
      <p class="text-center">{{ qr.status.toUpperCase() }}</p>
    </div>
  </div>
</div>
