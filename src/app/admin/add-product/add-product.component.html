<form [formGroup]="productForm" (ngSubmit)="submit()" class="container mt-4">
  <div class="row">
    <div class="col-md-6 mb-3">
      <label class="form-label">Product Name</label>
      <input
        formControlName="productName"
        type="text"
        class="form-control"
        placeholder="Enter product name"
      />
    </div>

    <div class="col-md-6 mb-3">
      <label class="form-label">Product Type</label>
      <input
        formControlName="productType"
        type="text"
        class="form-control"
        placeholder="Enter product type"
      />
    </div>
  </div>

  <div class="row">
    <div class="col-md-12 mb-3">
      <label class="form-label">Product Short Description</label>
      <textarea
        formControlName="shortDescription"
        type="text"
        class="form-control"
        placeholder="Enter product short description"
      ></textarea>
    </div>
  </div>

  <div class="row">
    <div class="col-md-6 mb-3">
      <label class="form-label">Image</label>
      <input
        type="file"
        class="form-control"
        (change)="onFileSelected($event)"
        accept="image/*"
      />
      <!-- Preview selected file -->
      <div *ngIf="selectedImage" class="mt-2">
        <img
          [src]="selectedImage"
          alt="Preview"
          class="img-thumbnail"
          width="150"
        />
      </div>
    </div>

    <div class="col-md-6 mb-3 d-flex align-items-end justify-content-end">
      <button type="button" class="btn btn-primary mt-2" (click)="addPack()">
        + Add Pack
      </button>
    </div>
  </div>

  <h4 class="mt-4">Pack Sizes</h4>
  <div formArrayName="packSize">
    <div
      *ngFor="let pack of packSize.controls; let i = index"
      [formGroupName]="i"
      class="row g-3 mb-2"
    >
      <div class="col-md-3">
        <input formControlName="mrp" class="form-control" placeholder="MRP" />
      </div>
      <div class="col-md-3">
        <input formControlName="size" class="form-control" placeholder="Size" />
      </div>
      <div class="col-md-3">
        <input
          formControlName="discount"
          class="form-control"
          placeholder="Discount %"
        />
      </div>
      <div class="col-md-3 d-flex">
        <button
          type="button"
          class="btn btn-danger w-100"
          (click)="removePack(i)"
        >
          Remove
        </button>
      </div>
    </div>
  </div>

  <div class="mt-4">
    <button
      type="submit"
      [disabled]="this.productForm.invalid"
      class="btn btn-success w-100"
    >
      Submit
    </button>
  </div>
</form>
