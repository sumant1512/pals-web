<div class="container mt-4">
  <h3 class="text-center mb-4">Add Dealer</h3>

  <form [formGroup]="dealerForm" (ngSubmit)="onSubmit()">
    <div class="mb-3">
      <label for="userType" class="form-label">Select User Type</label>
      <select class="form-select" formControlName="userType">
        <option *ngFor="let type of userTypes" [value]="type.value">
          {{ type.label }}
        </option>
      </select>
    </div>

    <div class="mb-3">
      <label class="form-label">Full Name</label>
      <input type="text" class="form-control" formControlName="name" />
    </div>

    <div class="mb-3">
      <label class="form-label">Mobile</label>
      <input type="text" class="form-control" formControlName="mobile" />
    </div>

    <div class="mb-3">
      <label class="form-label">Email</label>
      <input type="text" class="form-control" formControlName="email" />
    </div>

    <div class="mb-3">
      <label class="form-label">Shop Name</label>
      <input type="text" class="form-control" formControlName="shop" />
    </div>

    <div class="mb-3">
      <label class="form-label">Address</label>
      <input type="text" class="form-control" formControlName="address" />
    </div>

    <div class="row">
      <div class="col-md-6 mb-3">
        <label class="form-label">Pin</label>
        <input type="text" class="form-control" formControlName="pin" />
      </div>

      <div class="col-md-6 mb-3">
        <label class="form-label">City</label>
        <input type="text" class="form-control" formControlName="city" />
      </div>
    </div>

    <div class="mb-3">
      <label class="form-label">State</label>
      <input type="text" class="form-control" formControlName="state" />
    </div>

    <div *ngIf="errorMsg" class="alert alert-danger mt-3">
      {{ errorMsg }}
    </div>

    <button
      type="submit"
      class="btn btn-primary w-100 mt-3"
      [disabled]="dealerForm.invalid"
    >
      Register
    </button>
  </form>
</div>
