<div class="container">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="page-title">Add Coupon</h2>
    <div class="btn btn-primary" (click)="navigateToCoupons()">
      View Coupons
    </div>
  </div>

  <form [formGroup]="createCouponForm" (ngSubmit)="onSubmit()">
    <div class="mb-3">
      <label for="amount" class="form-label">Amount*</label>
      <input
        type="number"
        class="form-control"
        id="amount"
        formControlName="amount"
      />
    </div>
    <div class="mb-3">
      <label for="count" class="form-label">No of coupans*</label>
      <input
        type="number"
        class="form-control"
        id="count"
        formControlName="count"
      />
    </div>
    <button
      type="submit"
      [disabled]="createCouponForm.invalid"
      class="btn btn-primary"
    >
      Submit
    </button>
  </form>
</div>
