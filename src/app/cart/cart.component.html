<section>
  <div class="container cart-heading">
    <div class="row mt-5">
      <div class="col-lg-12">
        <div class="row shop-listing">
          <div *ngIf="cartItems?.length; else empty_cart">
            <table class="table shop-table" *ngIf="cartItems?.length">
              <tr>
                <th class="b-0">Name</th>
                <th class="b-0">Pack Size</th>
                <th class="b-0">Price</th>
                <th class="b-0">Discount</th>
                <th class="b-0">Final Price</th>
                <th class="b-0">Quantity</th>
                <th class="b-0 text-right">Total Price</th>
              </tr>
              <tr *ngFor="let item of cartItems">
                <td>{{ item?.productName }} ({{ item?.productType }})</td>
                <td>{{ item?.size }}</td>
                <td>{{ item?.mrp }}</td>
                <td>{{ item?.discount }}</td>
                <td>{{ item?.soldPrice }}</td>
                <td>
                  <button
                    class="btn btn-primary btn-sm"
                    (click)="
                      updateCartItemQuantity(item.cartItemId, item.quantity - 1)
                    "
                  >
                    -
                  </button>
                  {{ item.quantity }}
                  <button
                    class="btn btn-primary btn-sm"
                    (click)="
                      updateCartItemQuantity(item.cartItemId, item.quantity + 1)
                    "
                  >
                    +
                  </button>
                </td>
                <td class="text-right">
                  <h5 class="font-medium m-b-30">
                    {{ item?.soldPrice * item?.quantity }}
                  </h5>
                </td>
              </tr>
              <tr>
                <!-- <td colspan="3" align="right">Subtotal :{{ carts.subTotal }}</td> -->
                <td colspan="4" align="right">
                  <button class="btn btn-danger" (click)="emptyCart()">
                    Empty Cart
                  </button>
                </td>
              </tr>
            </table>
          </div>

          <ng-template #empty_cart>
            <app-empty-cart></app-empty-cart>
          </ng-template>
        </div>
      </div>
    </div>
  </div>
</section>
